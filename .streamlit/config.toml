[theme]
base = "dark"
primaryColor = "#00E5FF"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
linkColor = "#7DD3FC"
codeBackgroundColor = "#0F172A"
codeTextColor = "#A7F3D0"
borderColor = "#293548"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
codeFontSize = "0.86rem"

redColor = "#F87171"
orangeColor = "#FDBA74"
yellowColor = "#FACC15"
greenColor = "#34D399"
blueColor = "#38BDF8"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = ["#00E5FF", "#0072FF", "#A78BFA", "#34D399", "#FDBA74", "#F87171", "#94A3B8"]

[client]
toolbarMode = "minimal"

[server]
address = "0.0.0.0"
headless = true

[theme.sidebar]
backgroundColor = "#080C12"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#0F172A"
textColor = "#E5E7EB"
borderColor = "#1F2937"
primaryColor = "#00E5FF"
