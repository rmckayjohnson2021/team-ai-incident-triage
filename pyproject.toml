[project]
name = "team-ai-incident-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "streamlit>=1.64.0",
]

[project.scripts]
team-ai-incident-triage = "team_ai_incident_triage:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
